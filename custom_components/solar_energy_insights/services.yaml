simulate:
  fields:
    extra_kwh:
      required: true
      example: 1.2
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: kWh
    extra_hours:
      default: 1
      selector:
        number:
          min: 0.1
          max: 24
          step: 0.1
          unit_of_measurement: h
