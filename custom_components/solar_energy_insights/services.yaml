simulate:
  fields:
    appliances:
      example: "Dishwasher"
      selector:
        text:
          multiple: true
    extra_kwh:
      selector:
        number:
          min: 0
          max: 50
          step: 0.1
          unit_of_measurement: kWh
    extra_hours:
      default: 1
      selector:
        number:
          min: 0.1
          max: 24
          step: 0.1
          unit_of_measurement: h
    until:
      default: sunrise
      selector:
        select:
          translation_key: until
          options:
            - sunrise
            - sunset
    evening:
      default: mix
      selector:
        select:
          translation_key: evening
          options:
            - mix
            - cook
            - quiet
    forecast:
      default: expected
      selector:
        select:
          translation_key: forecast
          options:
            - expected
            - cloudy
            - sunny
value_upgrade:
  fields:
    sizes:
      required: true
      example: "[5, 8, 16]"
      selector:
        object:
relearn:
  fields:
    days:
      default: 30
      selector:
        number:
          min: 1
          max: 90
          unit_of_measurement: d
