simulate:
  fields:
    extra_kwh:
      required: true
      example: 1.2
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: kWh
    extra_hours:
      default: 1
      selector:
        number:
          min: 0.1
          max: 24
          step: 0.1
          unit_of_measurement: h
    without_runs:
      selector:
        entity:
          domain: sensor
          multiple: true
scenario:
  fields:
    extra_battery_kwh:
      default: 0
      example: 5
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          unit_of_measurement: kWh
    heat_loss_w_per_k:
      default: 0
      example: 180
      selector:
        number:
          min: 0
          max: 2000
          step: 5
          unit_of_measurement: W/K
    heating_limit_c:
      default: 15
      selector:
        number:
          min: 5
          max: 22
          step: 0.5
          unit_of_measurement: °C
    indoor_c:
      default: 20
      selector:
        number:
          min: 15
          max: 25
          step: 0.5
          unit_of_measurement: °C
    hot_water_kwh_per_day:
      default: 0
      example: 6
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          unit_of_measurement: kWh
    battery_price:
      example: 2500
      selector:
        number:
          min: 0
          max: 1000000
          step: 1
          mode: box
    design_flow_c:
      default: 45
      selector:
        number:
          min: 25
          max: 75
          step: 1
          unit_of_measurement: °C
    design_outdoor_c:
      default: -12
      selector:
        number:
          min: -30
          max: 5
          step: 1
          unit_of_measurement: °C
    heat_pump_kw:
      example: 7
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          unit_of_measurement: kW
    rated_cop:
      example: 4.5
      selector:
        number:
          min: 2
          max: 7
          step: 0.1
    hot_water_at_noon:
      default: false
      selector:
        boolean:
    gas_price:
      example: 0.11
      selector:
        number:
          min: 0
          max: 2
          step: 0.001
          mode: box
    boiler_efficiency:
      default: 0.9
      selector:
        number:
          min: 0.5
          max: 1.1
          step: 0.01
    gas_standing_charge:
      default: 0
      selector:
        number:
          min: 0
          max: 10000
          step: 1
          mode: box
    fill_year:
      default: true
      selector:
        boolean:
